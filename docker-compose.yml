services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: fieldguide
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"

    backend:
        build:
            context: ./fieldguide-BE
            dockerfile: Dockerfile
        restart: always
        depends_on:
            - db
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fieldguide
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
        ports:
            - "8080:8080"

    frontend:
        build:
            context: ./fieldguide-FE
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        restart: always
        depends_on:
            - backend
        ports:
            - "80:80"

volumes:
    db_data:
